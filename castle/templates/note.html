<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申し送り ── $company</title>
<style>
$theme
.wrap{max-width:700px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hint{color:var(--muted);font-size:11.5px;margin-top:7px}
.who{padding:9px 11px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg)}
.who span{color:var(--muted);font-size:11.5px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
form label:first-child{margin-top:0}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;
      padding:12px 16px;margin-bottom:8px;font-size:13.5px}
.note .meta{color:var(--muted);font-size:11.5px}
a{color:var(--bar)}
</style>
</head>
<body>
<div class="wrap">

<div class="eyebrow">$company</div>
<h1>申し送り</h1>
<div class="lead">
  ダッシュボードは「どこが落ちたか」までしか出せません。<b>「なぜ」は現場にしかありません。</b><br>
  ここに書いたものが、そのまま同じ画面に並びます。 ／ <a href="/">ダッシュボードへ戻る</a>
</div>

$message

<form method="post" action="/note">
  <div class="row">
    <div>
      <label for="occurred_at">対象日</label>
      <input type="date" id="occurred_at" name="occurred_at" value="$today" required>
    </div>
    <div>
      <label for="subject">部門</label>
      <select id="subject" name="subject" required>$departments</select>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="category">区分</label>
      <select id="category" name="category" required>$categories</select>
    </div>
    <div>
      <label for="author">入力者</label>
      $author_field
    </div>
  </div>

  <label for="text">内容</label>
  <textarea id="text" name="text" maxlength="400" required
            placeholder="例：北海道産の相場が高止まり。数量を絞って粗利を守っている。8月下旬に戻る見込み。"></textarea>
  <div class="hint">400文字まで。後から書き換えられません（訂正は新しく書き足してください）。</div>

  <button type="submit">記録する</button>
</form>

<h2>最近の申し送り</h2>
$recent

</div>
</body>
</html>
