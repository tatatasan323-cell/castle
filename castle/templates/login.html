<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アクセスキー ── $company</title>
<style>
$theme
.wrap{max-width:440px;padding-top:80px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
form label{margin-top:0}
.hint{color:var(--muted);font-size:11.5px;margin-top:24px;line-height:2}
.hint a{color:var(--bar)}
</style>
</head>
<body>
<div class="wrap">

<div class="eyebrow">$company</div>
<h1>アクセスキー</h1>
<div class="lead">城を開くには、配られたアクセスキーが要ります。</div>

$message

<form method="post" action="/login">
  <label for="token">アクセスキー</label>
  <input type="password" id="token" name="token" autocomplete="off" autofocus required>
  <button type="submit">開く</button>
</form>

<div class="hint">
  はじめての方は <a href="/guide">使い方</a> をご覧ください。<br>
  キーが分からない・失くした場合は、管理者に再発行を頼んでください。<br>
  再発行すると古いキーは使えなくなります。<br>
  キーは各自のものです。貸し借りすると、記録に残る名前が実際の入力者とずれます。
</div>

</div>
</body>
</html>
